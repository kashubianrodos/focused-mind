# Generates the Dart FFI binding to the BrainBit neurosdk2 C API.
# Run: dart run ffigen --config ffigen.yaml
#
# ffigen reports a SEVERE note that enum widths are implementation-defined.
# Every bound enum in cmn_type.h has an explicit underlying type
# (`enum X : uint8_t` / `int8_t`), and the generated code uses those widths,
# so the note does not apply here.
name: NeuroSdk2Bindings
description: Bindings to the neurosdk2 C API (scanner, sensor, Headband/BrainBit/BrainBit2 data).
output: lib/headband/ffi/neurosdk2_bindings.dart
headers:
  entry-points:
    - third_party/neurosdk2/include/sdk_api.h
  include-directives:
    - third_party/neurosdk2/include/sdk_api.h
    - third_party/neurosdk2/include/cmn_type.h
compiler-opts:
  - '-xc++'
  - '-std=c++17'
  - '-Ithird_party/neurosdk2/include'
functions:
  include:
    # Scanner
    - createScanner
    - freeScanner
    - startScanner
    - stopScanner
    - sensorsScanner
    # Sensor lifecycle and commands
    - createSensor
    - freeSensor
    - connectSensor
    - disconnectSensor
    - execCommandSensor
    - readStateSensor
    - readBattPowerSensor
    - readSamplingFrequencySensor
    # Common callbacks
    - addBatteryCallback
    - removeBatteryCallback
    - addConnectionStateCallback
    - removeConnectionStateCallback
    # Headband (Mindo)
    - addSignalDataCallbackHeadband
    - removeSignalDataCallbackHeadband
    - addResistCallbackHeadband
    - removeResistCallbackHeadband
    # BrainBit
    - addSignalDataCallbackBrainBit
    - removeSignalDataCallbackBrainBit
    - addResistCallbackBrainBit
    - removeResistCallbackBrainBit
    # BrainBit 2
    - readSupportedChannelsBrainBit2
    - addSignalCallbackBrainBit2
    - removeSignalCallbackBrainBit2
    - addResistCallbackBrainBit2
    - removeResistCallbackBrainBit2
structs:
  include:
    - _OpStatus
    - _SensorInfo
    - _HeadbandSignalData
    - _HeadbandResistData
    - _BrainBitSignalData
    - _BrainBitResistData
    - _SignalChannelsData
    - _ResistRefChannelsData
    - _EEGChannelInfo
  rename:
    '_(.*)': '$1'
enums:
  include:
    - SensorFamily
    - SensorCommand
    - SensorState
    - SensorSamplingFrequency
    - EEGChannelId
    - EEGChannelType
  as-int:
    include:
      - .*
typedefs:
  include:
    - SensorScanner
    - Sensor
preamble: |
  // Generated by ffigen from third_party/neurosdk2/include (neurosdk2 1.0.21).
  // Do not edit by hand; see ffigen.yaml.
  // ignore_for_file: type=lint
