name: iOS

# Builds an unsigned iPhone app on every push and pull request; a `v*` tag
# (e.g. v0.2.0) also attaches it to the GitHub release. Tests run in the
# macOS workflow.
#
# The .ipa is not signed: CI has no Apple certificate, and a free Personal
# Team can only sign on the developer's own Mac. Install it with a tool that
# re-signs with your Apple ID (for example Sideloadly or AltStore), or build
# from source as described in README "iPhone".
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    permissions:
      contents: write # create the release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipa=FocusedMind-$VERSION-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build app
        run: |
          flutter build ios --release --no-codesign \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"

      # An .ipa is a zip with the app under Payload/.
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "${{ steps.version.outputs.ipa }}" Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.ipa }}
          path: ${{ steps.version.outputs.ipa }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.version.outputs.ipa }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
