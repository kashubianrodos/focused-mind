name: macOS

# Checks every push and pull request; a `v*` tag (e.g. v0.1.0) also builds
# the release DMG and publishes it as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Analyze and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Host tests run BrainBit's real EmotionalMath library and compile the
      # native callback shim through the build hook.
      - run: flutter test

  build:
    name: Build DMG
    needs: test
    runs-on: macos-15
    permissions:
      contents: write # create the release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=FocusedMind-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build app
        run: >
          flutter build macos --release
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ github.run_number }}"

      # Optional Developer ID signing and notarization. Without these
      # secrets the app keeps Flutter's ad-hoc signature, and users open it
      # the first time with right-click › Open.
      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$IDENTITY" ]; then
            echo "No signing secrets: ad-hoc signed build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Sign app with Developer ID
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="build/macos/Build/Products/Release/focused_mind.app"
          # Nested code first (frameworks and BrainBit's dylibs), then the app
          # with the sandbox + Bluetooth entitlements and hardened runtime.
          find "$APP/Contents/Frameworks" -depth \
            \( -name '*.dylib' -o -name '*.framework' \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime \
              --sign "$IDENTITY" "{}"
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          APP="build/macos/Build/Products/Release/focused_mind.app"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/Focused Mind.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Focused Mind" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "${{ steps.version.outputs.dmg }}"

      - name: Notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG="${{ steps.version.outputs.dmg }}"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "No notarization secrets: signed but not notarized."
            exit 0
          fi
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.dmg }}
          path: ${{ steps.version.outputs.dmg }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.version.outputs.dmg }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
