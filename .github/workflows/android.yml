name: Android

# Builds the APK on every push and pull request; a `v*` tag (e.g. v0.2.0)
# also attaches it to the GitHub release. Tests run in the Test workflow; versions
# come from tool/ci_version.sh, shared with the iOS workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release on tags
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the build number

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Version
        id: version
        run: ./tool/ci_version.sh

      # Optional release keystore. Without it the APK is signed with a
      # throwaway debug key, so installing a newer build means uninstalling
      # the old one first. See README "CI and releases".
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No keystore secret: debug-signed APK."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.build }}"
          mv build/app/outputs/flutter-apk/app-release.apk "FocusedMind-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: FocusedMind-${{ steps.version.outputs.version }}.apk
          path: FocusedMind-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: FocusedMind-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
